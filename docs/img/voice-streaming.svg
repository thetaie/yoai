<svg xmlns="http://www.w3.org/2000/svg" width="1282" height="536" viewBox="-16 -48 1282 536" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-label="The microphone feeds an echo canceller, which takes what the speaker plays back out of the microphone signal, with the PCM played as its reference; its output feeds three paths to the speaker. The main line, framed and labeled The Qwen-Omni experience, without Qwen-Omni: ASR hands a chat model, local or remote, whole sentences cut at pauses, and the chat model streams its reply to TTS token by token. Beside ASR, emotion in reads the user's arousal from the sound, cut and timed by the transcript, and passes it to the chat model; the chat model hands its reply's valence, arousal and dominance to emotion out, which steers the TTS voice file. Below it, two omni paths, where one model takes the audio and speaks the reply itself: Qwen3-Omni-30B-A3B on vLLM-Omni, a remote provider on a GPU server or desktop, kept, made of a MoE thinker (30B total, 3B active, 48 layers, a router per layer picking 8 of 128 experts), a MoE talker (3B total, 0.3B active, 20 layers, 6 of 128 experts plus one shared), and a dense codec; and Qwen2.5-Omni-3B on MNN, a local provider on the device at RTF 3.0 on a phone, replaced by the main line.">
<rect x="-16" y="-48" width="1282" height="536" rx="12" fill="#ffffff"/>
<defs>
<marker id="arrow-chain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="arrow-ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker>
</defs>
<rect x="352" y="8" width="706" height="210" rx="16" fill="none" stroke="#24292f" stroke-width="2" stroke-dasharray="8 5"/>
<text x="354" y="-6" font-size="24" font-weight="700" fill="#24292f">The Qwen-Omni experience, without Qwen-Omni</text>
