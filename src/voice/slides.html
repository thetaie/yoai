<h2 id="autoregressive-tts-three-shapes">Autoregressive TTS: three shapes</h2>
<p>All generate frame by frame in an LM. They differ in what a step emits, and what runs after it.</p>
<div class="cols">
<div>
<h3 id="discrete-ar">Discrete AR</h3>
<svg viewBox="0 0 380 46" role="img" aria-label="Per frame, a language-model step and a small depth model; then the codec">
<defs><marker id="arrow-dar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a" /></marker></defs>

<rect x="113" y="6" width="46" height="34" rx="6" fill="#dafbe1" stroke="#1a7f37" />
<rect x="162" y="6" width="54" height="34" rx="6" fill="#ddf4ff" stroke="#0969da" />
<rect x="282" y="6" width="96" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de" />
</g>
<g text-anchor="middle" font-size="14" fill="#24292f">
<text x="24" y="28">LM</text>
<text x="77" y="28">depth</text>
<text x="136" y="28">LM</text>
<text x="189" y="28">depth</text>
<text x="229" y="28">…</text>
<text x="330" y="28">codec</text>
</g>
<line x1="242" y1="23" x2="278" y2="23" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-dar)" />
</svg>
<p>A step emits codec tokens; a small depth model fills the other codebooks.</p>
<ul>
<li><strong>Qwen3-TTS</strong> 0.6B / 1.7B · Apache 2.0 <span>Alibaba, 2026-01 · in use here</span></li>
<li><strong>Breeze TTS 2</strong> 3B · non-commercial <span>BreezeBlue, 2026-08 · Qwen3-TTS's codec</span></li>
<li><strong>Fish Audio S2-Pro</strong> 4B + 0.4B · research <span>Fish Audio, 2026-03 · slow AR over time, fast over codebooks</span></li>
<li><strong>Higgs Audio v3</strong> 4B · non-commercial <span>Boson AI, 2026-06 · Qwen3-4B, ~100 languages</span></li>
<li><strong>MOSS-TTS-Nano</strong> 0.1B · Apache 2.0 <span>OpenMOSS, 2026 · streams on 4 CPU cores; family up to 4B</span></li>
<li><strong>Magpie TTS</strong> 0.36B · NVIDIA Open Model <span>NVIDIA, 2026-07 · 2 frames a step; no cloning</span></li>
</ul>
<p class="more">Earlier: Orpheus, Llasa, Spark-TTS, Dia2, Kyutai TTS, OuteTTS, Sesame CSM. Closed: VALL-E (the first), MiMo-V2-TTS.</p>
</div>
<div>
<h3 id="ar-then-flow-or-diffusion">AR, then flow or diffusion</h3>
<svg viewBox="0 0 380 46" role="img" aria-label="Several language-model steps, then a flow network of N steps over the chunk, then a vocoder">

<p>The LM emits semantic tokens; a non-AR network turns each chunk into sound in N steps.</p>
<ul>
<li><strong>CosyVoice 2 / CosyVoice3</strong> 0.5B · Apache 2.0 <span>Alibaba, 2024-12 / 2025-12 · measured here</span></li>
<li><strong>IndexTTS-2.5</strong> 0.8B · Bilibili license <span>bilibili, 2026-08 · inline pinyin, duration, emotion vector</span></li>
<li><strong>GLM-TTS</strong> · license unverified <span>Zhipu, 2025-12 · phonemes in the text</span></li>
<li><strong>Step-Audio-EditX</strong> 3B · Apache 2.0 <span>StepFun, 2025-11 · edits emotion and style</span></li>
<li><strong>Chatterbox</strong> 0.5B · MIT <span>Resemble AI, 2025 · Turbo: one-step flow</span></li>
<li><strong>Voxtral TTS</strong> 4B · CC BY-NC <span>Mistral, 2026-03 · 16 flow steps inside every frame</span></li>
</ul>
<p class="more">Closed: Seed-TTS, MiniMax-Speech. Also Kimi-Audio's speech.</p>
</div>
<div>
<h3 id="continuous-ar">Continuous AR</h3>
<svg viewBox="0 0 380 46" role="img" aria-label="Per frame, a language-model step and a diffusion head of N steps; then a decoder">
<defs><marker id="arrow-cont" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a" /></marker></defs>

<p>No tokenizer; every step runs its own diffusion loop, so size does not predict cost.</p>
<ul>
<li><strong>VoxCPM2</strong> 2B · Apache 2.0 <span>OpenBMB, 2026-04 · 30 languages, 48 kHz; ggml port</span></li>
<li><strong>VibeVoice</strong> 1.5B / 7B · MIT <span>Microsoft, 2025-08 · 90 minutes, 4 speakers; TTS pulled</span></li>
<li><strong>Pocket TTS</strong> 0.1B · MIT <span>Kyutai, 2026-01 · one-step head; in llama.cpp</span></li>
</ul>
</div>
</div>
<p class="note">As of September 2026, from model cards; only Qwen3-TTS and CosyVoice3 were run here. Not AR, so left out: F5-TTS, MaskGCT, MegaTTS 3, Kokoro.
<br />Architecture undisclosed: ElevenLabs v3, Gemini 3.8 Flash TTS, Cartesia Sonic 3.6.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-marpit-scope-K0ik9XNO="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--theme:default;" data-marpit-pagination-total="9" data-size="16:9">
<h2 id="runtimes-split-by-stage-not-by-shape">Runtimes: split by stage, not by shape</h2>
<p>Each model does two kinds of work; each runtime is good at one.</p>
<div class="cols">
<div class="ar">
<h3 id="ar-stage--llamacpp">AR stage · llama.cpp</h3>
<ul>
<li>Every step reads every weight: <strong>bandwidth-bound</strong>. Omni's Talker: 30ms a token, about 13 GB/s.</li>
<li>Low bits cut the reads; KV cache and sampling are built in.</li>
<li>ONNX leaves the KV cache and the loop to the host.</li>
</ul>
</div>
<div class="nar">
<h3 id="non-ar-stage--onnx">Non-AR stage · ONNX</h3>
<ul>
<li>Codec, flow, vocoder, diffusion head: convolutions over a chunk, <strong>compute-bound</strong>. Qwen3-TTS's codec, CPU → iGPU: 34.9 → 6.3ms a frame.</li>
<li>Exported from PyTorch as is, onto GPU or NPU. ggml needs each written by hand.</li>
<li>Low bits break it: INT4 left omni's vocoder at 0.03 correlation with PyTorch.</li>
</ul>
</div>
</div>
<table>
<thead>
<tr>
<th>shape</th>
<th>llama.cpp</th>
<th>ONNX Runtime</th>
<th>verdict</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Discrete AR</strong></td>
<td>Single-codebook: plain GGUF (Orpheus, Llasa, OuteTTS).<br />Multi-codebook: the depth loop by hand, dispatch-bound (20.0 → 20.5ms on the iGPU)</td>
<td>codec only</td>
<td><strong>llama.cpp</strong></td>
</tr>
<tr>
<td><strong>AR, then flow</strong></td>
<td>LM as is; flow and vocoder by hand.<br />cosyvoice.cpp: RTF 4.16 on CPU, noise on Vulkan</td>
<td>flow and vocoder export as is</td>
<td><strong>both</strong>:<br />two memory pools, one GPU</td>
</tr>
<tr>
<td><strong>Continuous AR</strong></td>
<td>Embeddings in, hidden state out, the head a second graph; round trips every frame.<br />Ported: Pocket TTS, VoxCPM</td>
<td>LM step and unrolled head in one graph;<br />KV cache still outside</td>
<td><strong>neither fits</strong></td>
</tr>
</tbody>
</table>
<p class="note">MNN runs both stages in one engine: omni ran on the phone at RTF 3.0, but its Vulkan output was noise.
<br />NPUs suit the fixed-shape stages, not bandwidth-bound decoding; untried here.</p>
</section>

<div class="cols">
<p><strong>Talker</strong>: a Qwen3 decoder with M-RoPE. Text can also go all in the prompt.</p>
<p><strong>Code predictor</strong>: its cache resets every frame; serial, so dispatch-bound.</p>

<p class="variants"><b>Same networks, different checkpoints.</b> Each has its own talker file; the tokenizer file is shared:

<h2 id="the-reading-problem-speak-it-in-pieces">The reading problem: speak it in pieces</h2>
<p>A reply takes <strong>seconds to write</strong>, and a single <code>say()</code> waits for the last token; faster synthesis cannot recover that. <code>Reader</code> speaks while it is written: <code>begin()</code>, <code>feed(delta)</code> per token from any provider, <code>finish()</code>.</p>

<div class="cols">
<div>
<h3 id="how-it-cuts">How it cuts</h3>
<ul>
<li><code>SentenceStream</code> cuts the text as it arrives; each piece is its own <code>say()</code>.</li>
<li><strong>Piece 1 sets the wait</strong>: 12–40 characters. A full stop ends it from 6 on, since <span style="white-space: nowrap">&quot;你好。&quot;</span> alone comes out clipped.</li>
<li><strong>Later pieces</strong>: 30–80 characters, cut early when under 1s of audio is left.</li>
<li><strong>Cost</strong>: the pace resets at every seam. The voice file holds the pitch: 1.31 semitones of spread, 3.09 without it.</li>
<li><strong>Tolerant of a slow or bursty writer</strong>: each piece is complete text before it is spoken.</li>
</ul>
</div>
<div>
<h3 id="measured-in-the-app">Measured in the app</h3>
<p>The PC: speech on the Arc iGPU, the chat model on the CPU. First audio counts from sending, prefill included.</p>
<table>
<thead>

<th>chat model</th>

<td>Qwen3.5-2B</td>

<td>0.89–1.20</td>

</tr>
<tr>
<td>Qwen3.5-4B</td>
<td>4.0–8.1</td>
<td>1.17–2.73</td>
<td>0.20–0.33</td>
</tr>
</tbody>
</table>
<p>A writer at 4–8 tok/s still leaves the speech starved under 0.33s.</p>
</div>
</div>
<div class="rules">
<h3 id="rules-found-by-listening-none-visible-in-rtf">Rules found by listening, none visible in RTF</h3>
<div class="grid">
<p><strong>Pin the seed</strong> (default 101). A free seed is redrawn per <code>say()</code>: the pitch spread between pieces went from 10.1 Hz to 17.5.</p>
<p><strong>Merge a short last piece back</strong>, up to 40 characters. Alone it stops while the vowel still sounds, at −34 dBFS; folded in, it decays to −68.</p>
<p><strong>Hold 2 frames past the first stop</strong> (160ms). Without it, endings stopped mid-vowel; four frames sounded no different.</p>
</div>
</div>

</tbody>
</table>
<ul class="note">
<li>Heard: a style's voice file changes the reading, at no cost per frame; on the user's own voice, how far it can go is capped by the speaker (next slide). Not yet: fitting d<sub>V</sub>, d<sub>A</sub>, d<sub>D</sub> from eight labeled CustomVoice instructions.</li>
<li>Checked offline: A by prosody/; V and D by audeering's dimensional model, research only.</li>
<li>A named style is a point plus delivery: 郑重 = (0, 0, 1), slower. emotion2vec's labels are points too.</li>
<li>CustomVoice takes the nearest instruction instead.</li>
<li>To the user: only change from their own baseline, never a verdict.</li>
</ul>
</section>
