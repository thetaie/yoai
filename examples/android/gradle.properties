org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true

# arm64-v8a only. Every device this lane targets is 64-bit ARM, and each extra
# ABI is another full cross-compile of llama.cpp and qwentts.cpp plus another
# copy of the archives in the APK. Add x86_64 here if an emulator is ever
# wanted -- the SDKs under prebuilt/ would have to be built for it too.
yoai.abi=arm64-v8a

# clang 21. The newest NDK installed, chosen for the armv9 code generation this
# lane exists to measure: SVE2 and the rest of v9.2 are what a current Qualcomm
# core has over the Kirin 9020 every number in docs/voice.md was taken on.
yoai.ndk=30.0.14904198
